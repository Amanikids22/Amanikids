<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-learn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F7F2"/>
      <stop offset="60%" stop-color="#EFECE4"/>
      <stop offset="100%" stop-color="#E6E0D3"/>
    </linearGradient>
    <linearGradient id="sil-learn" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E3A2F" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#14261F" stop-opacity="0.52"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bg-grad-learn)"/>

  <!-- Subtle Radial Glow -->
  <circle cx="400" cy="230" r="160" fill="#E5A83B" opacity="0.08"/>
  <circle cx="400" cy="230" r="230" fill="none" stroke="#1E3A2F" stroke-width="1.2" opacity="0.1" stroke-dasharray="4 8"/>

  <!-- Silhouette of Student Reading / Learning with Mentor -->
  <g transform="translate(400, 310)" fill="url(#sil-learn)">
    <!-- Youth Student silhouette reading an open book -->
    <!-- Head -->
    <circle cx="-50" cy="-100" r="24"/>
    <!-- Upper Body curved over desk -->
    <path d="M-60,-74 C-45,-76 -30,-72 -18,-62 C0,-45 8,-15 10,65 L-100,65 C-98,-5 -90,-35 -75,-62 C-70,-68 -65,-72 -60,-74 Z"/>
    <!-- Arm reaching to book -->
    <path d="M-25,-30 Q15,-10 40,25 L15,40 Q-5,0 -35,-15 Z" opacity="0.8"/>

    <!-- Open Book Vector Motif -->
    <g transform="translate(40, 20)" fill="#CC5833" opacity="0.45">
      <path d="M-35,10 Q0,-5 35,10 L38,45 Q0,28 -35,45 Z"/>
      <line x1="0" y1="2" x2="0" y2="35" stroke="#FFFFFF" stroke-width="1.5" opacity="0.7"/>
    </g>

    <!-- Standing Mentor in Background -->
    <circle cx="85" cy="-135" r="22" opacity="0.6"/>
    <path d="M72,-111 C82,-114 94,-112 104,-106 C124,-94 135,-65 138,65 L50,65 C52,-45 58,-85 72,-111 Z" opacity="0.6"/>
  </g>

  <!-- Ground Plane -->
  <rect x="0" y="375" width="800" height="185" fill="#E2DDD2" opacity="0.55"/>

  <!-- Aesthetic Pill Badge -->
  <g transform="translate(400, 475)">
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#FFFFFF" opacity="0.94" stroke="#D8D2C4" stroke-width="1.2"/>
    <g transform="translate(-112, -10)" stroke="#CC5833" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" transform="scale(0.85)"/>
      <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" transform="scale(0.85)"/>
    </g>
    <text x="-12" y="5" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#22362C" letter-spacing="1.2" text-anchor="middle">PROGRAMME ÉDUCATIF • EN ATTENTE</text>
  </g>
</svg>
