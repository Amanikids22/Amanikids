<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-cult" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F4"/>
      <stop offset="60%" stop-color="#F0ECE2"/>
      <stop offset="100%" stop-color="#E5DFD0"/>
    </linearGradient>
    <linearGradient id="sil-cult" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2C4035" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#192A22" stop-opacity="0.52"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bg-grad-cult)"/>

  <!-- Subtle Radial Glow -->
  <circle cx="400" cy="220" r="170" fill="#CC5833" opacity="0.07"/>
  <circle cx="400" cy="220" r="230" fill="none" stroke="#D49B35" stroke-width="1.2" opacity="0.2" stroke-dasharray="6 6"/>

  <!-- Cultural & Community Silhouette (Drummer & Dancers / Celebration) -->
  <g transform="translate(400, 310)" fill="url(#sil-cult)">
    <!-- Central Traditional Drum (Ngoma / Djembe outline) -->
    <path d="M-32,-20 C-35,10 -25,45 -18,65 L18,65 C25,45 35,10 32,-20 Q0,-32 -32,-20 Z" fill="#D49B35" opacity="0.4"/>
    <ellipse cx="0" cy="-22" rx="32" ry="10" fill="#CC5833" opacity="0.45"/>

    <!-- Musician / Performer leaning over drum -->
    <circle cx="0" cy="-115" r="23"/>
    <path d="M-10,-90 C0,-92 10,-90 20,-84 C42,-70 52,-45 52,40 L-52,40 C-52,-45 -42,-70 -20,-84 Z"/>

    <!-- Youth / Dancer on the Left -->
    <circle cx="-130" cy="-80" r="19"/>
    <path d="M-138,-59 C-125,-60 -115,-58 -106,-50 C-88,-36 -82,-12 -82,65 L-160,65 C-160,-12 -154,-36 -138,-59 Z"/>

    <!-- Youth / Dancer on the Right -->
    <circle cx="130" cy="-85" r="20"/>
    <path d="M120,-63 C132,-64 142,-61 150,-53 C166,-38 172,-12 172,65 L95,65 C95,-12 102,-38 120,-63 Z"/>
  </g>

  <!-- Ground Plane -->
  <rect x="0" y="375" width="800" height="185" fill="#E0DAD0" opacity="0.55"/>

  <!-- Aesthetic Pill Badge -->
  <g transform="translate(400, 475)">
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#FFFFFF" opacity="0.94" stroke="#D8D2C4" stroke-width="1.2"/>
    <g transform="translate(-112, -10)" stroke="#CC5833" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="10" transform="scale(0.85)"/>
      <path d="m10 15 5-3-5-3v6Z" transform="scale(0.85)"/>
    </g>
    <text x="-12" y="5" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#22362C" letter-spacing="1.2" text-anchor="middle">ÉVÉNEMENT CULTUREL • EN ATTENTE</text>
  </g>
</svg>
