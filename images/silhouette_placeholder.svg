<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-general" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7F5EE"/>
      <stop offset="50%" stop-color="#EFECE2"/>
      <stop offset="100%" stop-color="#E5E0D3"/>
    </linearGradient>
    <linearGradient id="silhouette-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22362C" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#16251E" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="dot-pattern" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#D49B35" opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="560" fill="url(#bg-grad-general)"/>
  <rect width="800" height="560" fill="url(#dot-pattern)"/>

  <!-- Subtle Editorial Geometric Elements -->
  <circle cx="400" cy="240" r="180" fill="none" stroke="#D49B35" stroke-width="1.2" opacity="0.25" stroke-dasharray="6 6"/>
  <circle cx="400" cy="240" r="220" fill="none" stroke="#22362C" stroke-width="1" opacity="0.12"/>

  <!-- Dignified Community Silhouette Composition (Parent/Mentor & Children) -->
  <g transform="translate(400, 310)" fill="url(#silhouette-grad)">
    <!-- Central Mentor / Adult Silhouette -->
    <!-- Head -->
    <circle cx="0" cy="-140" r="26"/>
    <!-- Neck & Shoulders -->
    <path d="M-10,-112 C-10,-112 0,-115 10,-112 C32,-106 58,-85 64,-50 C68,-30 68,60 68,90 L-68,90 C-68,60 -68,-30 -64,-50 C-58,-85 -32,-106 -10,-112 Z"/>

    <!-- Left Child Silhouette (Reading / Looking Up) -->
    <!-- Head -->
    <circle cx="-110" cy="-75" r="20"/>
    <!-- Torso -->
    <path d="M-118,-53 C-105,-54 -95,-53 -86,-47 C-70,-36 -62,-15 -62,30 L-62,90 L-148,90 L-148,30 C-148,-15 -140,-36 -124,-47 C-122,-49 -120,-51 -118,-53 Z"/>

    <!-- Right Child Silhouette (Holding book / smiling) -->
    <!-- Head -->
    <circle cx="110" cy="-70" r="19"/>
    <!-- Torso -->
    <path d="M102,-49 C115,-50 125,-49 134,-43 C150,-32 158,-12 158,35 L158,90 L72,90 L72,35 C72,-12 80,-32 96,-43 C98,-45 100,-47 102,-49 Z"/>

    <!-- Shared Open Book / Activity Motif -->
    <path d="M-40,40 Q0,55 40,40 L44,82 Q0,92 -44,82 Z" fill="#D49B35" opacity="0.45"/>
  </g>

  <!-- Ground Plane Gradient -->
  <rect x="0" y="390" width="800" height="170" fill="#E2DCD0" opacity="0.6"/>

  <!-- Aesthetic Pill Badge: Amani Archive / Photo à venir -->
  <g transform="translate(400, 480)">
    <!-- Pill Container -->
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#FFFFFF" opacity="0.92" stroke="#D8D2C4" stroke-width="1.2"/>
    <!-- Camera/Image Icon -->
    <g transform="translate(-112, -10)" stroke="#CC5833" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M2 7h3l2-3h6l2 3h3a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2z" transform="scale(0.85)"/>
      <circle cx="8.5" cy="11.5" r="3" transform="scale(0.85)"/>
    </g>
    <!-- Badge Label -->
    <text x="-12" y="5" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#22362C" letter-spacing="1.2" text-anchor="middle">ARCHIVE AMANI • PHOTO À VENIR</text>
  </g>
</svg>
