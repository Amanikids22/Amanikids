<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad-fam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F3"/>
      <stop offset="60%" stop-color="#EFEBE1"/>
      <stop offset="100%" stop-color="#E4DED1"/>
    </linearGradient>
    <linearGradient id="sil-fam" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#23382D" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#14241D" stop-opacity="0.52"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="560" fill="url(#bg-grad-fam)"/>

  <!-- Subtle Radial Decorative Arcs -->
  <circle cx="400" cy="220" r="160" fill="#E5A83B" opacity="0.07"/>
  <circle cx="400" cy="220" r="230" fill="none" stroke="#23382D" stroke-width="1.2" opacity="0.12" stroke-dasharray="8 6"/>

  <!-- Family Silhouettes (Parents & Children Holding Hands / Together) -->
  <g transform="translate(400, 310)" fill="url(#sil-fam)">
    <!-- Father / Mentor -->
    <circle cx="-110" cy="-125" r="25"/>
    <path d="M-120,-98 C-110,-100 -98,-98 -88,-92 C-68,-78 -58,-50 -58,55 L-160,55 C-160,-50 -150,-78 -130,-92 Z"/>

    <!-- Mother / Mentor -->
    <circle cx="110" cy="-120" r="24"/>
    <path d="M100,-94 C110,-96 122,-94 132,-88 C152,-74 162,-46 162,55 L60,55 C60,-46 70,-74 90,-88 Z"/>

    <!-- Two Children in Center -->
    <circle cx="-25" cy="-70" r="19"/>
    <path d="M-32,-49 C-22,-50 -12,-48 -5,-42 C10,-30 16,-8 16,55 L-65,55 C-65,-8 -58,-30 -44,-42 Z"/>

    <circle cx="35" cy="-60" r="17"/>
    <path d="M30,-41 C38,-42 46,-40 52,-35 C64,-24 70,-5 70,55 L-5,55 C-5,-5 2,-24 12,-35 Z"/>
  </g>

  <!-- Ground Plane -->
  <rect x="0" y="365" width="800" height="195" fill="#DFD9CD" opacity="0.55"/>

  <!-- Aesthetic Pill Badge -->
  <g transform="translate(400, 475)">
    <rect x="-140" y="-20" width="280" height="40" rx="20" fill="#FFFFFF" opacity="0.94" stroke="#D8D2C4" stroke-width="1.2"/>
    <g transform="translate(-112, -10)" stroke="#CC5833" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" transform="scale(0.85)"/>
      <circle cx="9" cy="7" r="4" transform="scale(0.85)"/>
      <path d="M23 21v-2a4 4 0 0 0-3-3.87" transform="scale(0.85)"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75" transform="scale(0.85)"/>
    </g>
    <text x="-12" y="5" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="12" font-weight="700" fill="#22362C" letter-spacing="1.2" text-anchor="middle">ARCHIVE FAMILLE • EN ATTENTE</text>
  </g>
</svg>
